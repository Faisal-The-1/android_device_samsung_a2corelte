name: Build a2corelte ROM

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI or Termux
  push:
    branches:
      - main
    paths-ignore:
      - '**.md' # Ignore readme updates to save runner time

env:
  DEVICE: a2corelte
  VENDOR: samsung
  # Change this to your actual product makefile name (e.g., lineage_a2corelte-userdebug)
  TARGET: lineage_a2corelte-userdebug 
  BRANCH: lineage-20.0 # Adjust to your target ROM branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          repository: Faisal-The-1/android_device_samsung_a2corelte
          path: device/samsung/a2corelte

      - name: Checkout Vendor Tree
        uses: actions/checkout@v4
        with:
          repository: Faisal-The-1/android_vendor_samsung_a2corelte
          path: vendor/samsung/a2corelte

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev repo

      - name: Initialize & Sync Repo
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/LineageOS/android.git -b $BRANCH
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a2corelte.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Faisal-The-1/android_device_samsung_a2corelte" path="device/samsung/a2corelte" remote="github" revision="main" />
            <project name="Faisal-The-1/android_vendor_samsung_a2corelte" path="vendor/samsung/a2corelte" remote="github" revision="main" />
            <!-- Add your kernel and universal7870-common repos here -->
          </manifest>
          EOF
          # Use -j4 to avoid network throttling and runner limits
          repo sync -c --force-sync --no-clone-bundle --no-tags -j4

      - name: Setup Ccache
        run: |
          cd workspace
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 6G # Strict limit to prevent runner disk exhaustion

      - name: Build Target Files
        run: |
          cd workspace
          source build/envsetup.sh
          lunch $TARGET
          # Use -j4 to prevent OOM on 2-core runners. 
          # Building 'target-files-package' first is safer than 'bacon' for testing.
          mka target-files-package otatools -j4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte-target-files
          path: workspace/out/target/product/a2corelte/*.zip
          retention-days: 5
