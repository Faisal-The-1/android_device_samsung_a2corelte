name: Build a2corelte ROM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

env:
  DEVICE: a2corelte
  VENDOR: samsung
  TARGET: lineage_a2corelte-userdebug
  BRANCH: lineage-20.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "\$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Vendor Tree
        uses: actions/checkout@v4
        with:
          repository: Faisal-The-1/android_vendor_samsung_a2corelte
          path: vendor/samsung/a2corelte
          ref: main

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev repo

      - name: Initialize & Sync Repo
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/LineageOS/android.git -b \${{ env.BRANCH }}
          mkdir -p .repo/local_manifests
          cat << 'XMLEOF' > .repo/local_manifests/a2corelte.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Faisal-The-1/android_device_samsung_a2corelte" path="device/samsung/a2corelte" remote="github" revision="main" />
            <project name="Faisal-The-1/android_vendor_samsung_a2corelte" path="vendor/samsung/a2corelte" remote="github" revision="main" />
          </manifest>
          XMLEOF
          repo sync -c --force-sync --no-clone-bundle --no-tags -j4

      - name: Setup Ccache
        run: |
          cd workspace
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G

      - name: Build Target
        run: |
          cd workspace
          source build/envsetup.sh
          lunch \${{ env.TARGET }}
          mka target-files-package otatools -j4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte-build-output
          path: workspace/out/target/product/a2corelte/*.zip
          retention-days: 5
